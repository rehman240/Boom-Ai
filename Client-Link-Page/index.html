<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BOOOM More</title>
  <meta name="description" content="BOOOM More: from business idea to a ready campaign.">
  <meta name="theme-color" content="#040a1e">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-icon.png">
  <link rel="preconnect" href="https://booom-more-k7q2x9m4w8z1p6t3r5v0n2.vercel.app">
  <style>
    :root {
      --bg: #040a1e;
      --text: #eaf1fb;
      --muted: #a3b3d1;
      --primary: #2456f0;
      --primary-hover: #3466ff;
      --cyan: #2ec8ff;
      --blue: #3f8cff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 20px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 40px 16px;
      text-align: center;
    }
    .art { display: block; width: auto; max-width: 100%; max-height: 46vh; border-radius: 24px; }
    h1 { margin: 0; font-size: clamp(40px, 8vw, 64px); line-height: 1.05; letter-spacing: -0.02em; }
    h1 span { color: var(--cyan); }
    p { margin: 0; color: var(--muted); max-width: 40ch; }
    .open {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 420px;
      min-height: 76px;
      padding: 0 40px;
      border-radius: 20px;
      background: var(--primary);
      color: #fff;
      font-size: 26px;
      font-weight: 700;
      text-decoration: none;
    }
    .open:hover { background: var(--primary-hover); }
    .open:focus-visible { outline: 3px solid var(--cyan); outline-offset: 4px; }
    .tag { color: var(--cyan); font-weight: 600; }
    /* Full-screen splash: a tap anywhere shows the page. */
    body.splashing { overflow: hidden; }
    .splash { position: fixed; inset: 0; z-index: 50; width: 100%; height: 100vh; height: 100dvh; padding: 0; border: 0; background: var(--bg); cursor: pointer; }
    .splash img { display: block; width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body class="splashing">
  <button class="splash" id="splash" type="button" aria-label="Enter BOOOM More" autofocus>
    <picture>
      <source media="(min-aspect-ratio: 1/1)" srcset="hero-wide.webp">
      <img src="hero-tall.webp" alt="">
    </picture>
  </button>
  <!-- Optional sound: put a file named splash.mp3 next to this page and it plays on the tap. -->
  <audio id="splash-sound" src="splash.mp3" preload="auto"></audio>
  <picture>
    <source media="(min-width: 640px)" srcset="hero-wide.webp">
    <img class="art" src="hero-tall.webp" alt="BOOOM More logo">
  </picture>

  <h1>Make more <span>from your idea.</span></h1>
  <p>Find your audience. Shape the campaign. Create the ads, emails and posts. Plan the budget.</p>

  <a class="open" href="https://booom-more-k7q2x9m4w8z1p6t3r5v0n2.vercel.app/?from=booom">BOOOM &rarr;</a>

  <p class="tag">#yourworldforyou</p>

  <script>
    document.getElementById("splash").addEventListener("click", function () {
      var sound = document.getElementById("splash-sound");
      if (sound) sound.play().catch(function () {});
      this.remove();
      document.body.classList.remove("splashing");
    });
  </script>
</body>
</html>
