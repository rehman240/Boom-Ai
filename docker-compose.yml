# Local development database only. Production uses Supabase Postgres.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: boooom
      POSTGRES_PASSWORD: boooom
      POSTGRES_DB: boooom_more
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
